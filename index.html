<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        h2{
            color:red;
            background-color: burlywood;
            font-size:90px;
        }
        h1{
            color:chartreuse !important;
            background-color: blue !important;
            font-size: 80px !important;
        }
        h2{
            color: blue;
            background-color: cadetblue;
        }
    </style>
    <link href="css/style.css" rel="stylesheet" type="text/css"/>
</head>
<body>
    <!-- External CSS Example -->
    <h4>/ Welcome Shweta /</h4>

    <!-- Internal CSS Example -->
    <h2>Welcome Shweta</h2>
    <h1>| Welcome Shweta |</h1>
    <h2>Welcome Shweta !</h2>

    <!-- Inline CSS Example -->
    <h1 style="color:blue; background-color:yellow; font-size:80px">
        Hello, It's Shweta</h1>
    <h1 style="color:red; background-color:aqua; font-size:50px">
        Hello, Welcome Shweta</h1>
</body>
</html>
